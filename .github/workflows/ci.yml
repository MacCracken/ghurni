name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches prani / naad).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # Bare `cyrius test` picks up the [build] entry AND auto-discovers
        # tests/*.tcyr — the whole behavioural-parity suite.
        run: cyrius test

      - name: Bundle is in sync with src/
        # dist/ghurni.cyr is what CONSUMERS compile -- src/ and the bundle
        # drifting apart is invisible locally and breaks everyone downstream.
        # --check verifies without writing.
        run: cyrius distlib --check

      - name: Audit (fmt + lint + docs + tests + bench)
        # Exits 0 as of 2.0.2. This is the gate that keeps it there.
        run: cyrius audit

      - name: Policy check
        run: cyrius deny src/main.cyr

      - name: Fuzz
        # fuzz/ghurni.fcyr -- ~1600 adversarial checks over the public boundary.
        # NOTE `cyrius fuzz` exits 0 when it finds NO harnesses, so this step
        # would pass vacuously if fuzz/ ever disappeared. The guard below makes
        # the absence itself a failure.
        run: |
          test -n "$(ls fuzz/*.fcyr 2>/dev/null)" || {
            echo "no fuzz harness found in fuzz/ -- cyrius fuzz would pass vacuously"; exit 1; }
          cyrius fuzz

      - name: Coverage ratchet
        # A FLOOR, not a target. Coverage is not a correctness proof -- 2.0.1
        # shipped a 76.9x-wrong constant through a fully green suite. This only
        # stops coverage sliding backwards.
        run: cyrius coverage --min 65

      - name: Build and RUN examples
        # Each docs/examples/*.cyr is a standalone runnable program. Building
        # keeps the demos from bit-rotting against the API; RUNNING them is what
        # catches a demo that compiles and then faults, which a build-only step
        # let through.
        run: |
          for ex in docs/examples/*.cyr; do
            name="$(basename "$ex" .cyr)"
            echo "building $ex"
            cyrius build "$ex" "build/ex_$name"
            echo "running  $ex"
            "./build/ex_$name"
          done
